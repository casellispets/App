<!doctype html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#106B3A">
<meta name="description" content="Test de Bienestar Articular Canino de Caselli's Pets: una orientación breve sobre movilidad, dolor, actividad y calidad de vida.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Test de Bienestar Articular · Caselli's Pets">
<meta property="og:description" content="Conoce en pocos minutos algunas señales sobre el bienestar articular de tu perro.">
<title>Test de Bienestar Articular · Caselli's Pets</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN PLAN
     Layout: app-in-a-card — a centered mobile wizard (max 440px)
     floating on a warm cream field with soft blurred color blooms
     echoing the logo's sunburst; screens cross-fade/slide via a
     single #app container swapped by JS.
     Color: cream field, deep "pine" green as the voice of the
     brand, warm orange + sunny yellow as energetic accents, soft
     leaf green for "natural/calm" moments, fuchsia held back for
     tiny emotional sparks only (hearts, a single highlight).
     Type: Baloo 2 (rounded, friendly, carries headings + big
     numbers) paired with Nunito (body/UI, same rounded family of
     feeling, higher legibility at small sizes).
     ============================================================ */
  :root{
    --cream:#FFF5DF;
    --beige:#E9E2D3;
    --ink:#1E1E1E;
    --pine:#106B3A;
    --pine-dark:#0B4D29;
    --pine-light:#E4F0E8;
    --orange:#F36B32;
    --orange-light:#FDE7DC;
    --yellow:#FFD45A;
    --yellow-light:#FFF4D7;
    --leaf:#A7C77C;
    --leaf-light:#EFF5E6;
    --fuchsia:#FF2D8F;
    --white:#FFFFFF;
    --ink-soft:#5B6158;
    --ink-faint:#8A8F85;
    --border:rgba(16,61,37,.13);
    --shadow:rgba(23,50,33,.16);
    --font-display:'Baloo 2', ui-rounded, 'Nunito', sans-serif;
    --font-body:'Nunito', ui-sans-serif, system-ui, sans-serif;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    color-scheme: light;
  }
  /* El tema oscuro queda disponible solo si se activa a mano con
     data-theme="dark" (no hay ningún control que lo active hoy).
     No se activa más automáticamente según el modo oscuro del
     celular/navegador: la app siempre se ve con la paleta clara. */
  :root[data-theme="dark"]{
    --cream:#0E1F17;
    --beige:#16281D;
    --ink:#F3F1E7;
    --ink-soft:#BFC9BD;
    --ink-faint:#8C988C;
    --pine:#49B57C;
    --pine-dark:#2E8F5B;
    --pine-light:#163826;
    --orange:#FF8A57;
    --orange-light:#2B1D16;
    --yellow:#FFD45A;
    --yellow-light:#2B2414;
    --leaf:#A7C77C;
    --leaf-light:#1C2A19;
    --fuchsia:#FF66AC;
    --white:#17291F;
    --border:rgba(255,255,255,.12);
    --shadow:rgba(0,0,0,.45);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(640px 420px at 12% -6%, color-mix(in srgb, var(--yellow) 32%, transparent), transparent 60%),
      radial-gradient(520px 420px at 108% 14%, color-mix(in srgb, var(--leaf) 30%, transparent), transparent 60%),
      radial-gradient(640px 520px at 50% 118%, color-mix(in srgb, var(--orange) 22%, transparent), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
    padding-inline:16px;
    padding-block:max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;}

  .stage{
    width:100%;
    max-width:432px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    min-height:min(800px, calc(100vh - 40px));
  }

  .phone{
    position:relative;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:0 24px 60px -24px var(--shadow), 0 2px 10px -2px var(--shadow);
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:620px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:16px 18px 10px;
    flex:none;
  }
  .topbar.plain{justify-content:center;}
  .iconbtn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--border);
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    cursor:pointer;
    flex:none;
    transition:transform .15s ease, background .15s ease;
  }
  .iconbtn:active{transform:scale(.9);}
  .iconbtn:hover{background:var(--pine-light);}
  .iconbtn svg{width:18px;height:18px;}
  .iconbtn.ghost{visibility:hidden;}

  .progress-wrap{flex:1;display:flex;flex-direction:column;gap:5px;}
  .progress-track{
    height:8px;border-radius:99px;background:var(--beige);overflow:hidden;position:relative;
  }
  .progress-fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg, var(--pine), var(--pine-dark));
    width:0%;
    transition:width .55s cubic-bezier(.3,.9,.3,1);
    position:relative;
  }
  .progress-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    width:40px; transform:translateX(-60px);
    animation:sheen 2.2s ease-in-out infinite;
  }
  @keyframes sheen{ 0%{transform:translateX(-60px);} 60%,100%{transform:translateX(260px);} }
  .progress-label{
    font-size:11.5px; font-weight:700; color:var(--ink-faint);
    letter-spacing:.02em;
  }

  .brandmark{display:flex;align-items:center;gap:8px;}
  .brandmark img{width:30px;height:30px;border-radius:50%;flex:none;}
  .brandmark .names{display:flex;flex-direction:column;line-height:1.05;}
  .brandmark .names b{font-family:var(--font-display);font-size:14px;color:var(--pine);}
  .brandmark .names span{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);}

  /* ---------- screen container & transitions ---------- */
  .screens{
    position:relative;
    flex:1;
    display:flex;
    min-height:0;
  }
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:4px 20px 22px;
    overflow-y:auto;
    min-width:0;
  }
  .screen.enter-r{animation:inFromR .42s cubic-bezier(.22,1,.36,1) both;}
  .screen.enter-l{animation:inFromL .42s cubic-bezier(.22,1,.36,1) both;}
  @keyframes inFromR{from{opacity:0; transform:translateX(26px);} to{opacity:1; transform:translateX(0);}}
  @keyframes inFromL{from{opacity:0; transform:translateX(-26px);} to{opacity:1; transform:translateX(0);}}
  @media (prefers-reduced-motion: reduce){
    .screen.enter-r,.screen.enter-l{animation:fadeOnly .18s ease both;}
    .progress-fill::after{animation:none;}
  }
  @keyframes fadeOnly{from{opacity:0;}to{opacity:1;}}

  .grow{flex:1;}
  .stack{display:flex;flex-direction:column;gap:14px;}

  /* ---------- buttons ---------- */
  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:var(--font-display);font-weight:700;font-size:15.5px;
    border-radius:16px;
    padding:15px 18px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease, background .2s ease;
    width:100%;
  }
  .btn:active{transform:scale(.975);}
  .btn svg{width:18px;height:18px;flex:none;}
  .btn-primary{
    background:linear-gradient(180deg, var(--pine) 0%, var(--pine-dark) 100%);
    color:#fff;
    box-shadow:0 10px 22px -8px color-mix(in srgb, var(--pine) 55%, transparent);
  }
  .btn-primary:disabled{opacity:.42; cursor:not-allowed; box-shadow:none;}
  .btn-primary:not(:disabled):hover{filter:brightness(1.04);}
  .btn-ghost{
    background:var(--white); color:var(--pine);
    border:1.5px solid var(--border);
  }
  .btn-ghost:hover{background:var(--pine-light);}
  .btn-soft{background:var(--pine-light); color:var(--pine-dark); }
  .btn-sm{padding:11px 14px;font-size:13.5px;border-radius:13px;}
  .pulse-cta{animation:pulseGlow 2.6s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){.pulse-cta{animation:none;}}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 10px 22px -8px color-mix(in srgb, var(--pine) 55%, transparent);}
    50%{box-shadow:0 10px 30px -4px color-mix(in srgb, var(--pine) 70%, transparent);}
  }

  /* ---------- cover ---------- */
  .cover{align-items:stretch;}
  .cover-hero{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:18px 0 10px;
  }
  .ray-ring{
    position:absolute; width:230px;height:230px; border-radius:50%;
    background:conic-gradient(from 0deg,
      color-mix(in srgb, var(--yellow) 65%, transparent),
      transparent 18%, transparent 32%,
      color-mix(in srgb, var(--orange) 55%, transparent) 42%,
      transparent 58%, transparent 72%,
      color-mix(in srgb, var(--yellow) 55%, transparent) 84%,
      color-mix(in srgb, var(--yellow) 65%, transparent) 100%);
    filter:blur(1px);
    opacity:.55;
    animation:spin 22s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){.ray-ring{animation:none;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .cover-logo{
    position:relative; width:168px;height:168px;border-radius:50%;
    box-shadow:0 18px 34px -14px var(--shadow);
    animation:breathe 4.6s ease-in-out infinite;
  }
  .admin-heart-hotspot{
    position:absolute;z-index:3;left:calc(50% + 43px);top:54px;
    width:37px;height:37px;border:0;border-radius:50%;padding:0;
    background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .admin-heart-hotspot:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
  @media (prefers-reduced-motion: reduce){.cover-logo{animation:none;}}

  .pill-row{display:flex;gap:8px;margin-top:4px;}
  .pill{
    flex:1; background:var(--pine-light); border-radius:14px;
    padding:10px 6px; text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .pill svg{width:17px;height:17px;color:var(--pine);}
  .pill b{font-size:12px;color:var(--pine-dark);font-weight:800;}
  .pill span{font-size:9.5px;color:var(--ink-faint);font-weight:700;}

  .disclaimer{font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.4;}

  /* ---------- form ---------- */
  .avatar-wrap{display:flex;justify-content:center;margin:2px 0 2px;}
  .avatar{
    position:relative;width:88px;height:88px;border-radius:50%;
    background:linear-gradient(145deg,#f7fff9,var(--pine-light));
    display:flex;align-items:center;justify-content:center;
    border:2px solid color-mix(in srgb, var(--pine) 35%, transparent);
    box-shadow:0 12px 24px -17px var(--pine),inset 0 0 0 5px rgba(255,255,255,.72);
    cursor:pointer; overflow:hidden;
    transition:transform .15s ease;
  }
  .avatar::before{content:'';position:absolute;inset:7px;border:1.5px dashed color-mix(in srgb,var(--pine) 38%,transparent);border-radius:50%;}
  .avatar:active{transform:scale(.96);}
  .avatar:hover{transform:translateY(-2px);}
  .avatar img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;}
  .avatar-empty{position:relative;z-index:1;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,#eef9f1);box-shadow:0 7px 17px -12px var(--pine),inset 0 0 0 1px rgba(16,107,58,.08);}
  .avatar-empty::after{content:'+';position:absolute;right:3px;bottom:2px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--pine);color:#fff;font-size:14px;font-weight:800;border:2px solid #fff;line-height:1;}
  .avatar svg.paw{position:relative;z-index:1;width:30px;height:30px;color:var(--pine);filter:drop-shadow(0 3px 4px rgba(16,107,58,.16));}
  .avatar .cambadge{
    position:absolute;z-index:2;right:1px;bottom:1px;width:26px;height:26px;border-radius:50%;
    background:var(--orange); color:#fff; display:flex;align-items:center;justify-content:center;
    border:3px solid var(--white);
  }
  .avatar .cambadge svg{width:12px;height:12px;}
  .photo-required{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin:5px 0 7px;color:var(--orange);font-size:11px;font-weight:800;
  }
  .photo-required svg{width:14px;height:14px;flex:none;}
  .photo-required.done{color:var(--pine);}
  .photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 2px;}
  .photo-action{
    appearance:none;border:1.5px solid var(--border);border-radius:12px;padding:8px 9px;
    background:var(--white);color:var(--pine-dark);font-family:var(--font-body);
    font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 5px 12px -10px var(--shadow);transition:transform .14s ease,background .18s ease,border-color .18s ease;
  }
  .photo-action:hover{background:var(--pine-light);border-color:var(--pine);transform:translateY(-1px);}
  .photo-action:active{transform:scale(.97);}
  .photo-action svg{width:16px;height:16px;}
  .dog-screen{padding-bottom:18px;}
  .dog-screen .section-sub{margin-bottom:10px;}
  .dog-screen .stack{gap:10px;}
  .dog-screen .field{padding:9px 12px;border-radius:14px;}
  .dog-screen .field .fico{width:31px;height:31px;}
  .dog-screen .owner-intro{margin-top:12px!important;margin-bottom:0!important;}
  .dog-screen .owner-stack{margin-top:8px!important;}
  .dog-screen .foot-nav{margin-top:12px;}
  .contact-help{font-size:10.5px;color:var(--ink-faint);margin:5px 3px 0;line-height:1.35;}
  .contact-help.invalid{color:var(--orange);font-weight:750;}
  .field.invalid{border-color:var(--orange);box-shadow:0 0 0 2px color-mix(in srgb,var(--orange) 12%,transparent);}

  .field{
    display:flex;align-items:center;gap:12px;
    background:var(--cream);
    border:1px solid var(--border);
    border-radius:16px;
    padding:11px 14px;
  }
  .field .fico{
    width:34px;height:34px;border-radius:10px;background:var(--white);
    display:flex;align-items:center;justify-content:center;flex:none;color:var(--pine);
    box-shadow:0 1px 2px var(--shadow);
  }
  .field .fico svg{width:17px;height:17px;}
  .field .flabels{flex:1; min-width:0;}
  .field label{display:block;font-size:10.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.03em;}
  .field input{
    width:100%; border:none; background:transparent; outline:none;
    font-family:var(--font-body); font-weight:700; font-size:14.5px; color:var(--ink);
    padding:1px 0 0;
  }
  .field select{
    width:100%;border:0;outline:0;background:transparent;color:var(--ink);
    font:700 13.5px/1.3 var(--font-body);padding:1px 0;cursor:pointer;
  }
  .field input::placeholder{color:var(--ink-faint); font-weight:600;}

  /* ---------- category badge header ---------- */
  .cat-head{
    position:relative;isolation:isolate;overflow:hidden;
    display:flex;align-items:center;gap:11px;
    background:linear-gradient(135deg,
      color-mix(in srgb, var(--cathead-bg, var(--pine-light)) 88%, #fff),
      var(--cathead-bg, var(--pine-light)));
    border:1px solid color-mix(in srgb, var(--cathead-fg, var(--pine)) 18%, transparent);
    border-radius:19px; padding:12px 15px; margin-bottom:15px;
    box-shadow:0 8px 20px -14px color-mix(in srgb, var(--cathead-fg, var(--pine)) 55%, transparent),
      inset 0 1px 0 rgba(255,255,255,.72);
  }
  .cat-head::after{
    content:'';position:absolute;z-index:-1;
    width:92px;height:92px;border-radius:50%;right:-28px;top:-46px;
    background:color-mix(in srgb, var(--cathead-fg, var(--pine)) 13%, transparent);
    box-shadow:-38px 58px 0 -27px color-mix(in srgb, var(--cathead-fg, var(--pine)) 12%, transparent);
  }
  .cat-head .cico{
    width:42px;height:42px;border-radius:14px;
    background:linear-gradient(145deg, #fff, color-mix(in srgb, var(--cathead-bg, var(--pine-light)) 72%, #fff));
    display:flex;align-items:center;justify-content:center;
    color:var(--cathead-fg, var(--pine));
    border:1px solid rgba(255,255,255,.82);
    box-shadow:0 7px 14px -8px color-mix(in srgb, var(--cathead-fg, var(--pine)) 65%, transparent);
    animation:iconPop .5s cubic-bezier(.26,1.4,.4,1) both;
  }
  @keyframes iconPop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .cat-head .cico svg{width:19px;height:19px;}
  .cat-head b{font-family:var(--font-display);font-size:15.5px;color:var(--cathead-fg,var(--pine-dark));line-height:1.1;}
  .cat-head span{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-top:2px;}

  .cat-scene{
    position:relative; border-radius:22px; overflow:hidden; margin:0 1px 17px;
    background:var(--scene-bg, var(--pine-light));
    width:calc(100% - 2px);height:clamp(150px,38vw,170px);flex:none;
    border:3px solid var(--white);
    outline:1px solid color-mix(in srgb, var(--scene-fg, var(--pine)) 22%, transparent);
    box-shadow:0 13px 25px -14px color-mix(in srgb, var(--scene-fg, var(--pine)) 60%, var(--shadow)),
      0 3px 8px -4px var(--shadow);
  }
  .cat-scene svg{width:100%;height:100%;display:block;}
  .cat-scene img{
    width:100%;height:100%;display:block;object-fit:cover;object-position:center;
    will-change:transform,filter;animation-play-state:running !important;
  }
  .scene-sprite{
    position:absolute;inset:0;overflow:hidden;
  }
  .scene-sprite span{
    position:absolute;inset:0;
    background-image:var(--frame);
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    opacity:0;will-change:opacity;
  }
  .scene-sprite span:nth-child(1){--frame:var(--frame1);opacity:1;}
  .scene-sprite span:nth-child(2){--frame:var(--frame2);}
  .scene-sprite span:nth-child(3){--frame:var(--frame3);}
  .scene-sprite.is-playing span:nth-child(1){animation:spriteFade1 5.4s ease-in-out infinite;}
  .scene-sprite.is-playing span:nth-child(2){animation:spriteFade2 5.4s ease-in-out infinite;}
  .scene-sprite.is-playing span:nth-child(3){animation:spriteFade3 5.4s ease-in-out infinite;}
  /* Escaleras sin dificultad: sube hasta arriba y vuelve a bajar. */
  .scene-sprite.is-playing[data-qid="m2"][data-answer="0"] span:nth-child(1){animation:stairsNormal1 7s ease-in-out infinite;}
  .scene-sprite.is-playing[data-qid="m2"][data-answer="0"] span:nth-child(2){animation:stairsNormal2 7s ease-in-out infinite;}
  .scene-sprite.is-playing[data-qid="m2"][data-answer="0"] span:nth-child(3){animation:stairsNormal3 7s ease-in-out infinite;}
  @keyframes spriteFade1{
    0%,23%{opacity:1;} 34%,86%{opacity:0;} 96%,100%{opacity:1;}
  }
  @keyframes spriteFade2{
    0%,23%{opacity:0;} 34%,56%{opacity:1;} 67%,100%{opacity:0;}
  }
  @keyframes spriteFade3{
    0%,56%{opacity:0;} 67%,86%{opacity:1;} 96%,100%{opacity:0;}
  }
  @keyframes stairsNormal1{0%,8%{opacity:1}15%,78%{opacity:0}86%,100%{opacity:1}}
  @keyframes stairsNormal2{0%,8%{opacity:0}15%,29%{opacity:1}36%,59%{opacity:0}66%,78%{opacity:1}86%,100%{opacity:0}}
  @keyframes stairsNormal3{0%,29%{opacity:0}36%,59%{opacity:1}66%,100%{opacity:0}}
  .cat-scene:has(.scene-sprite)::before{opacity:0;animation:none;}
  .cat-scene img.preview-pop{
    animation:previewPop .34s cubic-bezier(.2,.8,.3,1) both,
      previewMotion 2.2s .34s ease-in-out infinite !important;
  }
  @keyframes previewPop{
    from{opacity:.2;transform:scale(1.09);filter:saturate(.7) brightness(1.12);}
    to{opacity:1;transform:scale(1.04);filter:saturate(1) brightness(1);}
  }
  @keyframes previewMotion{
    0%,100%{transform:translate3d(-1.5%,1%,0) rotate(-.4deg) scale(1.055);}
    50%{transform:translate3d(1.5%,-1.5%,0) rotate(.4deg) scale(1.085);}
  }
  .cat-scene::before{content:'';position:absolute;z-index:1;inset:0;pointer-events:none;opacity:0;}
  .cat-scene::after{
    content:'';position:absolute;z-index:2;inset:0;pointer-events:none;
    background:none;
  }
  /* Bucles livianos tipo GIF: cada categoría tiene un movimiento propio. */

   reforzar el reconocimiento visual del bloque y evitar cambios de perro. */
const QUESTION_SCENE = {

  d1:'assets/jack-dolor-v2.jpg', d2:'assets/jack-dolor-v2.jpg', d3:'assets/jack-dolor-v2.jpg',

  actividad:'Jack Russell corriendo detrás de una pelota', calidad:'Jack Russell descansando en su cama',

function randomScenePick(){
  const pick = {};
  Object.keys(SCENE_POOL).forEach(k=>{ pick[k] = Math.floor(Math.random()*SCENE_POOL[k].length); });
  return pick;

function sceneImgFor(catKey, qid){
  const spriteKey = qid || (catKey==='alarma' ? 'alarm-intro' : null);
  const answerIndex = qid ? state.answers[qid] : null;
  const sprite = spriteKey && spriteBaseForAnswer(spriteKey, answerIndex);
  if(sprite){
    const playing = qid ? answerIndex!=null : (catKey==='alarma' && state.alarms.length>0);
    const frames = qid ? answerFrames(sprite, answerIndex) : [`${sprite}-1.jpg`,`${sprite}-2.jpg`,`${sprite}-3.jpg`];
    return `<div class="scene-sprite ${playing?'is-playing':''}" role="img" aria-label="${SCENE_ALT[catKey]||'Perro'}" data-qid="${qid||''}" data-current-preview="${sprite}" data-sprite-base="${sprite}" data-answer="${answerIndex==null?'':answerIndex}" style="--frame1:url('${frames[0]}');--frame2:url('${frames[1]}');--frame3:url('${frames[2]}')"><span></span><span></span><span></span></div>`;
  }
  /* Si la pregunta tiene una ilustración puntual asignada (QUESTION_SCENE)
     la usamos; si no (pantalla de alarmas, por ejemplo), caemos al pool
     por categoría como antes. Siempre son las ilustraciones propias de
     Caselli's Pets, nunca fotos reales de perros. */
  const direct = qid && QUESTION_SCENE[qid];
  const pool = SCENE_POOL[catKey] || [];
  const pickIdx = (state.scenePick && state.scenePick[catKey]!=null) ? state.scenePick[catKey] : 0;
  const src = direct || pool[pickIdx % pool.length] || pool[0];
  return `<img class="scene-${catKey}" src="${src}" alt="${SCENE_ALT[catKey]||'Perro'}" loading="lazy">`;
}

function spriteBaseForAnswer(qid, answerIndex){
  const variants = OPTION_SPRITE[qid];
  return (variants && answerIndex!=null && variants[answerIndex]) || SPRITE_SCENE[qid];
}

/* Cada respuesta usa una cadencia visual diferente. Reutilizamos los tres
   fotogramas de la escena para mantener al mismo perro y evitar saltos de
   identidad, pero cambiamos el recorrido según la intensidad elegida. */
function answerFrames(base, answerIndex){
  const frame = n=>`${base}-${n}.jpg`;
  if(answerIndex==null) return [frame(1),frame(2),frame(3)];
  if(/-o\d+-v\d+$/.test(base)) return [frame(1),frame(2),frame(3)];
  const q = QUESTIONS.find(item=>item.id===stepKey());
  const option = q && q.options[answerIndex];
  if(q && q.id==='m2' && Number(answerIndex)===0) return [frame(1),frame(2),frame(3)];
  if(q && q.id==='m1'){
    if(Number(answerIndex)===0) return [frame(1),frame(2),frame(3)];
    if(Number(answerIndex)===1) return [frame(1),frame(2),frame(2)];
    if(Number(answerIndex)===2) return [frame(1),frame(1),frame(2)];
  }
  if(q && q.id==='a1'){
    if(Number(answerIndex)===0) return [frame(1),frame(2),frame(3)];
    if(Number(answerIndex)===1) return [frame(1),frame(2),frame(2)];
    if(Number(answerIndex)===2) return [frame(1),frame(1),frame(2)];
    return [frame(1),frame(1),frame(1)];
  }
  if(q && q.id==='c1'){
    if(Number(answerIndex)===0) return [frame(1),frame(1),frame(1)];
    if(Number(answerIndex)===1) return [frame(1),frame(2),frame(1)];
    if(Number(answerIndex)===2) return [frame(1),frame(2),frame(3)];
    return [frame(1),frame(3),frame(3)];
  }
  if(q && q.id==='c2'){
    if(Number(answerIndex)===0) return [frame(1),frame(2),frame(3)];
    if(Number(answerIndex)===1) return [frame(1),frame(2),frame(2)];
    if(Number(answerIndex)===2) return [frame(1),frame(1),frame(2)];
    return [frame(1),frame(1),frame(1)];
  }
  if(option && option.na) return [frame(1),frame(1),frame(1)];
  const severity = option ? option.v : Number(answerIndex);
  if(severity<=0) return [frame(1),frame(2),frame(1)];
  if(severity===1) return [frame(1),frame(2),frame(2)];
  if(severity===2) return [frame(1),frame(2),frame(3)];
  if(severity===3) return [frame(1),frame(3),frame(2)];
  return [frame(3),frame(2),frame(3)];
}

  'keeshond':'keeshond',
  'corgi':'corgi/cardigan','welsh corgi':'corgi/cardigan',
};
/* Perros sin raza definida (mestizos, "de la calle", cruzas, etc.): para
   estos casos NO buscamos fotos en la API por raza (la categoría "mix" de
   Dog CEO no sirve para esto), directamente usamos las fotos genéricas
   rotativas de SCENE_POOL, como corresponde a un perro sin raza. */
const NO_BREED_TERMS = ['mestizo','mestiza','cruza','cruzado','cruzada','criollo','criolla','mixto','mixta','mix','sin raza','sin raza definida','srd','calle','callejero','callejera','indefinida','ninguna'];
function isNoBreedText(breedText){
  const key = normalizeBreed(breedText);
  if(!key) return true;
  return NO_BREED_TERMS.some(term => key===term || key.includes(term));
}
function resolveBreedSlug(breedText){
  const key = normalizeBreed(breedText);
  if(!key) return null;
  if(BREED_API_MAP[key]) return BREED_API_MAP[key];
  const found = Object.keys(BREED_API_MAP).find(k => key.includes(k) || k.includes(key));
  return found ? BREED_API_MAP[found] : null;
}
/* Si el nombre de raza no está en nuestro diccionario en español (por ej.
   razas poco comunes o escritas distinto), probamos además contra la lista
   real de razas de la API, en inglés, por si coincide directamente. */
let breedListCache = null;
async function getLiveBreedList(){
  if(breedListCache) return breedListCache;
  try{
    const res = await fetch('https://dog.ceo/api/breeds/list/all');
    const json = await res.json();
    if(json.status==='success' && json.message){ breedListCache = json.message; return breedListCache; }
  }catch(e){ /* sin conexión: seguimos sin lista en vivo */ }
  return null;
}
function resolveBreedSlugFromLiveList(breedText, list){
  if(!list) return null;
  const key = normalizeBreed(breedText);
  if(!key) return null;
  const words = key.split(' ').filter(Boolean);
  let best = null;
  for(const breed of Object.keys(list)){
    const subs = list[breed];
    if(subs.length){
      for(const sub of subs){
        if(key.includes(sub) || words.includes(sub)) return `${breed}/${sub}`;
      }
      if(key.includes(breed) || words.includes(breed)) best = `${breed}/${subs[0]}`;
    } else if(key.includes(breed) || words.includes(breed)){
      best = breed;
    }
  }
  return best;
}
async function fetchBreedPhotos(breedText){
  if(isNoBreedText(breedText)) return null;
  let slug = resolveBreedSlug(breedText);
  if(!slug){
    const list = await getLiveBreedList();
    slug = resolveBreedSlugFromLiveList(breedText, list);
  }
  if(!slug) return null;
  try{
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
    // Pedimos más de las que necesitamos: la API de razas puede repetir fotos,
    // sobre todo en razas con pocas imágenes disponibles. Filtramos duplicados
    // y, si no llegan a 5 distintas, esas secciones usan la foto curada normal
    // (ver sceneImgFor) en vez de repetir la misma imagen.
    const res = await withTimeout(fetch(`https://dog.ceo/api/breed/${slug}/images/random/10`), 4500);
    if(!res.ok) return null;
    const json = await res.json();
    if(json.status==='success' && Array.isArray(json.message) && json.message.length){
      const unique = [...new Set(json.message)];
      return unique.slice(0, 5);
    }
  }catch(e){ console.warn('No se pudieron obtener fotos de la raza:', e); }
  return null;
}

  EC:{name:'Ecuador',dial:'593',digits:9,groups:[2,3,4],example:'99 123 4567'},

  DO:{name:'República Dominicana',dial:'1',digits:10,groups:[3,3,4],example:'809 123 4567'},

  VE:{name:'Venezuela',dial:'58',digits:10,groups:[3,3,4],example:'412 123 4567'},
};
function countryConfig(code){ return PHONE_COUNTRIES[code] || PHONE_COUNTRIES.PE; }
function nationalPhoneDigits(value, code){
  const raw = String(value||'').trim();
  let digits = raw.replace(/\D/g,'');
  const dial = countryConfig(code).dial;
  if(digits.startsWith(dial) && (raw.startsWith('+') || digits.length>dial.length)) digits = digits.slice(dial.length);
  return digits;
}
function formatPhoneForCountry(value, code){
  const cfg = countryConfig(code);
  return formatNationalPhoneDigits(nationalPhoneDigits(value, code), code);
}
function formatNationalPhoneDigits(value, code){
  const cfg = countryConfig(code);
  let digits = String(value||'').replace(/\D/g,'').slice(0,cfg.digits);
  const parts = [];
  cfg.groups.forEach(size=>{ if(digits){ parts.push(digits.slice(0,size)); digits = digits.slice(size); } });
  return `+${cfg.dial}${parts.length?' '+parts.join(' '):''}`;
}

function isValidContact(value){
  const raw = String(value||'').trim();
  if(!raw) return false;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(raw);
  const phoneCharsOk = /^[+\d\s().-]+$/.test(raw);
  const cfg = countryConfig(state.owner.country);
  const phoneOk = phoneCharsOk && nationalPhoneDigits(raw,state.owner.country).length===cfg.digits;
  return emailOk || phoneOk;
}

function computeScores(){
  const cat = {movilidad:0,dolor:0,actividad:0,calidad:0};
  QUESTIONS.forEach(q=>{
    const ai = state.answers[q.id];
    const val = (ai==null) ? 0 : q.options[ai].v;
    cat[q.cat]+=val;
  });
  const total = cat.movilidad+cat.dolor+cat.actividad+cat.calidad;
  return {cat, total};
}

function animateResult(){
  const {cat, total} = computeScores();

  const arc = document.getElementById('gauge-arc');

  if(arc){ requestAnimationFrame(()=>{ arc.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1)'; arc.style.strokeDashoffset = target; }); }
  if(num){
    const start = performance.now();
    const dur = 1100;
    function step(t){
      const p = Math.min(1,(t-start)/dur);
      const eased = 1-Math.pow(1-p,3);
      num.textContent = Math.round(eased*total);

/* ---------- helpers de color e imagen para el PDF ---------- */
function hexToRgb(hex){
  const h = String(hex||'#1E1E1E').replace('#','');
  const n = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
  return [parseInt(n.slice(0,2),16)||0, parseInt(n.slice(2,4),16)||0, parseInt(n.slice(4,6),16)||0];
}
const PDF_VAR_HEX = {
  pine:'#106B3A', 'pine-dark':'#0B4D29', 'pine-light':'#E4F0E8',
  orange:'#F36B32', 'orange-light':'#FDE7DC',
  yellow:'#FFD45A', 'yellow-light':'#FFF4D7',
  leaf:'#A7C77C', 'leaf-light':'#EFF5E6',
  fuchsia:'#FF2D8F', ink:'#1E1E1E', 'ink-soft':'#5B6158', 'ink-faint':'#8A8F85',
  cream:'#FFF5DF', beige:'#E9E2D3', white:'#FFFFFF',
};
function cssColorToRgb(v, fallback){
  if(!v) return hexToRgb(fallback||'#1E1E1E');
  if(v[0]==='#') return hexToRgb(v);
  const m = /var\(--([a-z-]+)\)/.exec(v);
  if(m && PDF_VAR_HEX[m[1]]) return hexToRgb(PDF_VAR_HEX[m[1]]);
  return hexToRgb(fallback||'#1E1E1E');
}
function loadImageDataURL(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = function(){
      try{
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0);
        resolve({url:c.toDataURL('image/png'), w:img.naturalWidth, h:img.naturalHeight});
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    img.src = src;
  });
}
function loadPetPhotoForPDF(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = function(){
      try{
        const size = 360;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        const scale = Math.max(size/img.naturalWidth, size/img.naturalHeight);
        const sw = size/scale, sh = size/scale;
        const sx = (img.naturalWidth-sw)/2, sy = (img.naturalHeight-sh)/2;
        const radius = 52;
        ctx.beginPath();
        ctx.moveTo(radius,0); ctx.lineTo(size-radius,0); ctx.quadraticCurveTo(size,0,size,radius);
        ctx.lineTo(size,size-radius); ctx.quadraticCurveTo(size,size,size-radius,size);
        ctx.lineTo(radius,size); ctx.quadraticCurveTo(0,size,0,size-radius);
        ctx.lineTo(0,radius); ctx.quadraticCurveTo(0,0,radius,0); ctx.closePath();
        ctx.clip();
        ctx.drawImage(img,sx,sy,sw,sh,0,0,size,size);
        resolve({url:c.toDataURL('image/png'), w:size, h:size});
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    img.src = src;
  });
}

/* ---------- informe completo en PDF (jsPDF) ----------
   Resumen por sección (sin el detalle pregunta por pregunta) + gráfico de
   puntaje por categoría + recomendaciones, con los colores e identidad de
   Caselli's Pets. */
async function downloadReportPDF(){
  let logo = null;
  let petPhoto = null;
  try{ logo = await loadImageDataURL(LOGO_LG); }catch(e){ logo = null; }
  try{ if(state.dog.photo) petPhoto = await loadPetPhotoForPDF(state.dog.photo); }catch(e){ petPhoto = null; }
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const marginX = 48;
    const contentW = pageW - marginX*2;
    const pine = [16,107,58], ink = [30,30,30], faint = [90,96,88];
    let y = 56;

    const contentBottom = pageH - 64;
    function checkBreak(extra){
      if(y + (extra||70) > contentBottom){ doc.addPage(); y = 56; }
    }
    function wrapped(text, x, width, opts){
      opts = opts || {};
      const lines = doc.splitTextToSize(text, width);
      lines.forEach(line=>{
        checkBreak();
        doc.text(line, x, y);
        y += opts.lh || 15;
      });
    }

    const {cat, total} = computeScores();
    const lvl = levelFor(total);
    const lvlIdx = LEVELS.indexOf(lvl);
    const d = state.dog, o = state.owner;

    /* ----- encabezado con logo ----- */
    if(logo){
      const lh = 36, lw = lh*(logo.w/logo.h);
      doc.addImage(logo.url, 'PNG', marginX, y-26, lw, lh);
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(pine[0],pine[1],pine[2]);
      doc.text("Caselli's Pets", marginX+lw+10, y-6);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(faint[0],faint[1],faint[2]);
      doc.text('Fisioterapia & bienestar animal', marginX+lw+10, y+8);
    } else {
      doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(pine[0],pine[1],pine[2]);
      doc.text("Caselli's Pets", marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(faint[0],faint[1],faint[2]);
      doc.text('Fisioterapia & bienestar animal', marginX, y+14);
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(faint[0],faint[1],faint[2]);
    doc.text(new Date().toLocaleDateString('es-PE'), pageW-marginX, y, {align:'right'});
    y += 32;
    doc.setDrawColor(pine[0],pine[1],pine[2]); doc.setLineWidth(1);
    doc.line(marginX, y, pageW-marginX, y);
    y += 26;

    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text('Test de Bienestar Articular - Informe de resultado', marginX, y);
    y += 26;

    /* ----- ficha ordenada: foto, datos del perro y contacto ----- */
    const cardY = y, cardH = 112;
    const dividerX = marginX + contentW*.56;
    const photoSize = 66;
    doc.setFillColor(248,251,248);
    doc.setDrawColor(214,226,217);
    doc.setLineWidth(.8);
    doc.roundedRect(marginX, cardY, contentW, cardH, 11, 11, 'FD');
    doc.setDrawColor(220,228,221);
    doc.line(dividerX, cardY+14, dividerX, cardY+cardH-14);

    const dogTextX = petPhoto ? marginX+14+photoSize+13 : marginX+16;
    const dogTextW = dividerX-dogTextX-14;
    if(petPhoto){
      doc.setFillColor(228,240,232);
      doc.roundedRect(marginX+14, cardY+23, photoSize, photoSize, 10, 10, 'F');
      doc.addImage(petPhoto.url, 'PNG', marginX+14, cardY+23, photoSize, photoSize);
      doc.setDrawColor(190,213,198);
      doc.roundedRect(marginX+14, cardY+23, photoSize, photoSize, 10, 10, 'S');
    }

    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(pine[0],pine[1],pine[2]);
    doc.text('Datos del perro', dogTextX, cardY+22);
    let dogY = cardY+42;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.7); doc.setTextColor(ink[0],ink[1],ink[2]);
    [`Nombre: ${d.name||'-'}`, `Edad: ${d.age||'-'}`, d.breed?`Raza: ${d.breed}`:null, d.weight?`Peso: ${d.weight} kg`:null]
      .filter(Boolean).forEach(line=>{
        doc.splitTextToSize(line, dogTextW).forEach(part=>{ doc.text(part, dogTextX, dogY); dogY += 14; });
      });

    const contactX = dividerX+16;
    const contactW = pageW-marginX-contactX-14;
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(pine[0],pine[1],pine[2]);
    doc.text('Datos de contacto', contactX, cardY+22);
    let contactY = cardY+42;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.7); doc.setTextColor(ink[0],ink[1],ink[2]);
    const contactLines = [
      o.name ? `Propietario/a: ${o.name}` : null,
      o.country ? `País: ${countryConfig(o.country).name}` : null,
      o.contact ? `Contacto: ${o.contact}` : null,
    ].filter(Boolean);
    contactLines.forEach(line=>{
      doc.splitTextToSize(line, contactW).forEach(part=>{ doc.text(part, contactX, contactY); contactY += 14; });
    });
    y = cardY + cardH + 20;

    /* ----- resultado general: caja de color según el nivel ----- */
    checkBreak(120);
    const isMixBg = lvl.bg.indexOf('color-mix')>=0;
    const boxBg = isMixBg ? hexToRgb('#FCE2EC') : cssColorToRgb(lvl.bg);
    const boxFg = cssColorToRgb(lvl.fg, '#106B3A');
    const boxW = contentW;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const lvlTextLines = doc.splitTextToSize(lvl.text, boxW-32);
    const boxH = 46 + lvlTextLines.length*13;
    doc.setFillColor(boxBg[0],boxBg[1],boxBg[2]);
    doc.roundedRect(marginX, y, boxW, boxH, 10, 10, 'F');
    let by = y+25;
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(boxFg[0],boxFg[1],boxFg[2]);
    doc.text(`Nivel ${lvlIdx+1}: ${lvl.label}`, marginX+16, by);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(ink[0],ink[1],ink[2]);
    doc.text(`${total} / ${MAX_TOTAL} puntos`, marginX+boxW-16, by, {align:'right'});
    by += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(faint[0],faint[1],faint[2]);
    lvlTextLines.forEach(line=>{ doc.text(line, marginX+16, by); by += 13; });
    y += boxH + 22;

    /* ----- gráfico: puntaje por categoría ----- */
    checkBreak(150);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(pine[0],pine[1],pine[2]);
    doc.text('Puntaje por categoría', marginX, y); y += 22;

    const labelW = 118, scoreW = 50, barX = marginX+labelW, barW = contentW-labelW-scoreW, barH = 12;
    Object.keys(CATS).forEach(key=>{
      checkBreak(34);
      const c = CATS[key];
      const score = cat[key];
      const fg = cssColorToRgb(c.fg), bg = cssColorToRgb(c.bg);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(ink[0],ink[1],ink[2]);
      doc.text(c.label, marginX, y+barH-2);
      doc.setFillColor(bg[0],bg[1],bg[2]);
      doc.roundedRect(barX, y, barW, barH, 6, 6, 'F');
      if(score>0){
        const fillW = Math.max(barH, barW*(score/CAT_MAX));
        doc.setFillColor(fg[0],fg[1],fg[2]);
        doc.roundedRect(barX, y, fillW, barH, 6, 6, 'F');
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(faint[0],faint[1],faint[2]);
      doc.text(`${score} / ${CAT_MAX}`, barX+barW+scoreW-4, y+barH-2, {align:'right'});
      y += barH + 15;
    });
    y += 6;

    /* ----- resumen por sección (sin el detalle de cada pregunta) ----- */
    checkBreak(100);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(pine[0],pine[1],pine[2]);
    doc.text('Resumen por sección', marginX, y); y += 20;

    Object.keys(CATS).forEach(key=>{
      checkBreak(50);
      const c = CATS[key];
      const fg = cssColorToRgb(c.fg);
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(fg[0],fg[1],fg[2]);
      doc.text(`${c.label} - ${cat[key]}/${CAT_MAX}`, marginX, y); y += 17;
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(faint[0],faint[1],faint[2]);
      wrapped(catTierText(key, cat[key]), marginX, contentW, {lh:15});
      y += 11;
    });
    y += 6;

    /* ----- recomendaciones (mismo contenido que en la app) ----- */
    checkBreak(100);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(pine[0],pine[1],pine[2]);
    doc.text('Nuestras recomendaciones', marginX, y); y += 20;

    recommendationCards().forEach(card=>{
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      const titleLines = doc.splitTextToSize(card.t, contentW-28);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
      const bodyLines = doc.splitTextToSize(card.p, contentW-28);
      const titleLH = 14, bodyLH = 14, titleBodyGap = 5;
      const cardH = 17 + titleLines.length*titleLH + titleBodyGap + bodyLines.length*bodyLH + 13;
      checkBreak(cardH+14);
      const bg = cssColorToRgb(card.bg), fg = cssColorToRgb(card.fg, '#106B3A');
      doc.setFillColor(bg[0],bg[1],bg[2]);
      doc.roundedRect(marginX, y, contentW, cardH, 9, 9, 'F');
      doc.setFillColor(fg[0],fg[1],fg[2]);
      doc.roundedRect(marginX, y, 4, cardH, 2, 2, 'F');
      let cy = y+19;
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(fg[0],fg[1],fg[2]);
      titleLines.forEach(line=>{ doc.text(line, marginX+16, cy); cy += titleLH; });
      cy += titleBodyGap;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(ink[0],ink[1],ink[2]);
      bodyLines.forEach(line=>{ doc.text(line, marginX+16, cy); cy += bodyLH; });
      y += cardH + 12;
    });

    /* ----- pie ----- */
    checkBreak(40);
    y += 4;
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(faint[0],faint[1],faint[2]);
    wrapped("Este test es una herramienta de orientación y no sustituye el examen veterinario profesional. Caselli's Pets · casellispets.com", marginX, contentW, {lh:11});

    /* ----- pie de página en todas las hojas (look de informe profesional) ----- */
    const pageCount = doc.internal.getNumberOfPages();
    for(let p=1; p<=pageCount; p++){
      doc.setPage(p);
      doc.setDrawColor(224,218,204); doc.setLineWidth(.6);
      doc.line(marginX, pageH-38, pageW-marginX, pageH-38);
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(pine[0],pine[1],pine[2]);
      doc.text("Caselli's Pets", marginX, pageH-24);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(faint[0],faint[1],faint[2]);
      doc.text('Informe de Bienestar Articular', marginX+62, pageH-24);
      doc.text(`Página ${p} de ${pageCount}`, pageW-marginX, pageH-24, {align:'right'});
    }

    const safeName = (d.name||'perro').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    doc.save(`test-articular-${safeName}-${new Date().toISOString().slice(0,10)}.pdf`);
    toast('Informe descargado');
  }catch(e){
    console.error('No se pudo generar el informe:', e);
    toast('No se pudo generar el informe');
  }
}

/* ====================== NAVIGATION ====================== */
function goBack(){
  if(state.idx>0){ state.idx--; render('l'); }
}
function goNext(){ state.idx++; render('r'); }

function afterRenderEffects(){
  const key = stepKey();
  if(key==='result') animateResult();
  if(key==='categories') animateCategoryBars();
}

/* ====================== EVENTS ====================== */
let adminHeartTaps = 0;
let adminHeartTimer = null;
function handleAdminHeartTap(){
  adminHeartTaps += 1;
  clearTimeout(adminHeartTimer);
  if(adminHeartTaps < 3){
    adminHeartTimer = setTimeout(()=>{ adminHeartTaps = 0; }, 1400);
    return;
  }
  adminHeartTaps = 0;
  const password = window.prompt('Ingresa la contraseña de administración:');
  if(password==null || !password.trim()) return;
  fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:password})
  }).then(async response=>{
    if(!response.ok) throw new Error('Clave incorrecta');
    const data = await response.json();
    localStorage.setItem('caselli_admin_token', data.token);
    window.location.href = '/admin.html';
  }).catch(()=>toast('Contraseña incorrecta'));
}

document.getElementById('phone').addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action==='admin-heart'){ handleAdminHeartTap(); return; }
  if(action==='start'){ goNext(); return; }
  if(action==='back'){ goBack(); return; }

  if(action==='choose-photo' || action==='choose-gallery'){
    document.getElementById('photoInput').click();
    return;
  }
  if(action==='take-photo'){
    document.getElementById('cameraInput').click();
    return;
  }

  if(action==='continue-dog'){
    state.dog.name = (document.getElementById('f-name')||{}).value || state.dog.name;
    state.dog.age = (document.getElementById('f-age')||{}).value || state.dog.age;
    state.owner.name = (document.getElementById('f-owner-name')||{}).value || state.owner.name;
    state.owner.contact = (document.getElementById('f-owner-contact')||{}).value || state.owner.contact;
    if(!(state.dog.photo && state.dog.name && state.dog.age)){
      toast('Completa la foto, el nombre y la edad de tu perro');
      return;
    }
    if(!isValidContact(state.owner.contact)){
      toast('Ingresa un número de WhatsApp o correo electrónico válido');
      const contact = document.getElementById('f-owner-contact');
      if(contact) contact.focus();
      return;
    }
    /* Ya no buscamos fotos reales de la raza (API Dog CEO): usamos siempre
       las ilustraciones de SCENE_POOL para mantener el estilo consistente. */
    goNext();
    return;
  }

  if(action==='toggle-alarm'){
    const val = el.getAttribute('data-val');
    const preview = el.getAttribute('data-preview');
    const v = (val==='none') ? 'none' : Number(val);
    if(v==='none'){
      state.alarms = state.alarms.includes('none') ? [] : ['none'];
    } else {
      state.alarms = state.alarms.filter(a=>a!=='none');
      if(state.alarms.includes(v)) state.alarms = state.alarms.filter(a=>a!==v);
      else state.alarms.push(v);
    }
    render();
    requestAnimationFrame(()=>setAlarmPreview(preview));
    const btn = document.getElementById('alarms-continue');
    if(btn) btn.disabled = !state.alarms.length;
    return;
  }
  if(action==='continue-alarms'){ if(state.alarms.length) goNext(); return; }

  if(action==='select-option'){
    const qid = stepKey();
    state.answers[qid] = Number(el.getAttribute('data-val'));
    render();
    return;
  }
  if(action==='next-question'){
    const qid = stepKey();
    if(state.answers[qid]!=null) goNext();
    return;
  }

  if(action==='view-categories' || action==='view-recommendations' || action==='continue-share'){ goNext(); return; }

  if(action==='request-eval'){
    if(WHATSAPP_NUMBER){
      const {cat, total} = computeScores();
      const lvl = levelFor(total);
      const d = state.dog;
      const msg = `Hola! Completé el Test de Bienestar Articular de ${d.name||'mi perro'} en Caselli's Pets.\n`
        + `Resultado: ${total}/${MAX_TOTAL} — Nivel ${LEVELS.indexOf(lvl)+1}: ${lvl.label}.\n`
        + `Me gustaría solicitar una evaluación.`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
      return;
    }
    const note = document.getElementById('eval-note');
    if(note) note.classList.toggle('show');
    return;
  }

  if(action==='copy-summary'){ copyToClipboard(summaryText()); return; }
  if(action==='download-report'){ downloadReportPDF(); return; }

  if(action==='restart'){
    state = freshState();
    try{ sessionStorage.removeItem('caselli_test_state'); }catch(e){}
    render('l');
    return;
  }
});

function setAlarmPreview(src){
  const sprite = document.querySelector('.scene-alarma .scene-sprite');
  if(!sprite || !src) return;
  const changed = sprite.dataset.currentPreview !== src;
  if(changed){
    sprite.style.setProperty('--frame1', `url('${src}-1.jpg')`);
    sprite.style.setProperty('--frame2', `url('${src}-2.jpg')`);
    sprite.style.setProperty('--frame3', `url('${src}-3.jpg')`);
    sprite.dataset.currentPreview = src;
  }
  startSprite(sprite, changed);
}
function startSprite(sprite, restart){
  if(!sprite) return;
  if(restart || !sprite.classList.contains('is-playing')){
    sprite.classList.remove('is-playing');
    void sprite.offsetWidth;
    sprite.classList.add('is-playing');
  }
}
function stopSprite(sprite){
  if(sprite) sprite.classList.remove('is-playing');
}
function setQuestionPreview(answerIndex, restart=true){
  const sprite = document.querySelector('.cat-scene .scene-sprite');
  if(!sprite) return;
  const qid = stepKey();
  const base = spriteBaseForAnswer(qid, Number(answerIndex));
  if(!base) return;
  const frames = answerFrames(base, Number(answerIndex));
  sprite.style.setProperty('--frame1', `url('${frames[0]}')`);
  sprite.style.setProperty('--frame2', `url('${frames[1]}')`);
  sprite.style.setProperty('--frame3', `url('${frames[2]}')`);
  sprite.dataset.answer = String(answerIndex);
  sprite.dataset.spriteBase = base;
  startSprite(sprite, restart);
}
function resetQuestionPreview(){
  const sprite = document.querySelector('.cat-scene .scene-sprite');
  const qid = stepKey();
  const base = SPRITE_SCENE[qid];
  if(!sprite || !base) return;
  sprite.style.setProperty('--frame1', `url('${base}-1.jpg')`);
  sprite.style.setProperty('--frame2', `url('${base}-2.jpg')`);
  sprite.style.setProperty('--frame3', `url('${base}-3.jpg')`);
  sprite.dataset.spriteBase = base;
  sprite.dataset.answer = '';
  stopSprite(sprite);
}

/* Mouse: vista previa sin click. Teclado: al enfocar. En pantallas táctiles
   el pointerdown muestra la escena antes de que se procese la selección. */
document.getElementById('phone').addEventListener('pointerover', function(e){
  if(!matchMedia('(hover:hover)').matches) return;
  const row = e.target.closest('.opt');
  if(!row || row.contains(e.relatedTarget)) return;
  if(row.dataset.preview) setAlarmPreview(row.dataset.preview);
  else if(row.dataset.action==='select-option') setQuestionPreview(row.dataset.answerIndex, true);
});
document.getElementById('phone').addEventListener('pointerout', function(e){
  if(!matchMedia('(hover:hover)').matches) return;
  const row = e.target.closest('.opt');
  if(!row || row.contains(e.relatedTarget)) return;
  if(row.dataset.preview){
    const selected = document.querySelector('.opt.selected[data-preview]');
    if(selected) setAlarmPreview(selected.dataset.preview);
    else {
      const sprite = document.querySelector('.scene-alarma .scene-sprite');
      if(sprite && sprite.dataset.currentPreview!==ALARM_DEFAULT_PREVIEW){
        sprite.style.setProperty('--frame1', `url('${ALARM_DEFAULT_PREVIEW}-1.jpg')`);
        sprite.style.setProperty('--frame2', `url('${ALARM_DEFAULT_PREVIEW}-2.jpg')`);
        sprite.style.setProperty('--frame3', `url('${ALARM_DEFAULT_PREVIEW}-3.jpg')`);
        sprite.dataset.currentPreview = ALARM_DEFAULT_PREVIEW;
      }
      stopSprite(sprite);
    }
  } else if(row.dataset.action==='select-option'){
    const selected = document.querySelector('.opt.selected[data-answer-index]');
    if(selected) setQuestionPreview(selected.dataset.answerIndex, false);
    else resetQuestionPreview();
  }
});
document.getElementById('phone').addEventListener('pointerdown', function(e){
  if(e.pointerType==='mouse') return;
  const row = e.target.closest('.opt');
  if(!row) return;
  if(row.dataset.preview) setAlarmPreview(row.dataset.preview);
  else if(row.dataset.action==='select-option') setQuestionPreview(row.dataset.answerIndex, true);
});
document.getElementById('phone').addEventListener('focusin', function(e){
  const row = e.target.closest('.opt');
  if(!row) return;
  if(row.dataset.preview) setAlarmPreview(row.dataset.preview);
  else if(row.dataset.action==='select-option') setQuestionPreview(row.dataset.answerIndex, true);
});

document.getElementById('phone').addEventListener('input', function(e){
  if(e.target.id==='f-owner-contact'){
    const raw = e.target.value;
    if(!raw.includes('@') && /\d/.test(raw)){
      e.target.value = formatPhoneForCountry(raw, state.owner.country);
    }
  }
  if(e.target.id==='f-name' || e.target.id==='f-age' || e.target.id==='f-owner-contact'){
    state.dog.name = (document.getElementById('f-name')||{}).value||'';
    state.dog.age = (document.getElementById('f-age')||{}).value||'';
    state.owner.contact = (document.getElementById('f-owner-contact')||{}).value||'';
    const btn = document.getElementById('dog-continue');
    if(btn) btn.disabled = !(state.dog.photo && state.dog.name && state.dog.age && isValidContact(state.owner.contact));
    const contactField = document.getElementById('contact-field');
    const contactHelp = document.getElementById('contact-help');
    const badContact = !!state.owner.contact && !isValidContact(state.owner.contact);
    if(contactField) contactField.classList.toggle('invalid',badContact);
    if(contactHelp) contactHelp.classList.toggle('invalid',badContact);
  }
  if(e.target.id==='f-breed') state.dog.breed = e.target.value;
  if(e.target.id==='f-weight') state.dog.weight = e.target.value;
  if(e.target.id==='f-owner-name') state.owner.name = e.target.value;
  if(e.target.id==='f-owner-contact') state.owner.contact = e.target.value;
});

function stylizePhoto(dataUrl, cb){
  const img = new Image();
  img.onload = function(){
    try{
      const SIZE = 320;
      const c = document.createElement('canvas');
      c.width = SIZE; c.height = SIZE;
      const ctx = c.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width-side)/2, sy = (img.height-side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, SIZE, SIZE);
      const id = ctx.getImageData(0,0,SIZE,SIZE);
      const d = id.data;
      const levels = 5, step = 255/(levels-1);
      const satBoost = 1.18;
      for(let i=0;i<d.length;i+=4){
        const r=d[i], g=d[i+1], b=d[i+2];
        const avg = (r+g+b)/3;
        let nr = avg + (r-avg)*satBoost;
        let ng = avg + (g-avg)*satBoost;
        let nb = avg + (b-avg)*satBoost;
        nr = Math.round(Math.round(nr/step)*step);
        ng = Math.round(Math.round(ng/step)*step);
        nb = Math.round(Math.round(nb/step)*step);
        d[i] = Math.max(0,Math.min(255,nr));
        d[i+1] = Math.max(0,Math.min(255,ng));
        d[i+2] = Math.max(0,Math.min(255,nb));
      }
      const src = new Uint8ClampedArray(d);
      const lum = new Float32Array(SIZE*SIZE);
      for(let p=0, i=0;i<d.length;i+=4,p++) lum[p] = 0.299*src[i]+0.587*src[i+1]+0.114*src[i+2];
      for(let y=1;y<SIZE-1;y++){
        for(let x=1;x<SIZE-1;x++){
          const p = y*SIZE+x;
          const gx = lum[p-1]-lum[p+1];
          const gy = lum[p-SIZE]-lum[p+SIZE];
          const mag = Math.sqrt(gx*gx+gy*gy);
          if(mag>38){
            const i = p*4;
            d[i]=38; d[i+1]=34; d[i+2]=30;
          }
        }
      }
      ctx.putImageData(id,0,0);
      cb(c.toDataURL('image/jpeg',0.92));
    }catch(err){ cb(dataUrl); }
  };
  img.onerror = function(){ cb(dataUrl); };
  img.src = dataUrl;
}

document.getElementById('phone').addEventListener('change', function(e){
  if(e.target.id==='f-owner-country'){
    const previousCountry = state.owner.country || 'PE';
    const nextCountry = e.target.value;
    const current = state.owner.contact || '';
    state.owner.country = nextCountry;
    if(current && !current.includes('@')){
      const national = nationalPhoneDigits(current, previousCountry);
      state.owner.contact = national ? formatNationalPhoneDigits(national, nextCountry) : '';
    }
    render();
    return;
  }
  if(e.target.id==='photoInput' || e.target.id==='cameraInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      stylizePhoto(ev.target.result, function(styled){
        state.dog.photo = styled;
        render();
        toast('Foto con efecto ilustrado aplicado');
      });
    };
    reader.readAsDataURL(file);
  }
});

/* ====================== BOOT ====================== */
const hotSnapshot = ()=> state;
function boot(initial){
  if(initial && typeof initial==='object' && initial.idx!=null) state = initial;
  render('r');
  afterRenderEffectsLoop();
}
function afterRenderEffectsLoop(){
  const origRender = render;
  window.__origRender = origRender;
}
const _render = render;
render = function(dir){
  _render(dir);
  afterRenderEffects();
};

if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(hotSnapshot);
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
} else {
  boot();
}

})();
