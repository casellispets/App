services:
  - type: web
    name: caselli-pets-bienestar
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: caselli-pets-db
          property: connectionString

databases:
  - name: caselli-pets-db
    plan: free
